services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: matchx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: matchx
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchx"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
